<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Schéma réaliste du concept Ri7aLive</title>
<desc id="desc">Trois étapes: mesure d'une empreinte odorante dans un restaurant, traitement et envoi de données, puis restitution approximative par un appareil à cartouches équipé de micro-pompes et d'une chambre de mélange.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9f6f1"/><stop offset="1" stop-color="#eee8e0"/></linearGradient>
  <linearGradient id="navy" x1="0" x2="1"><stop stop-color="#173956"/><stop offset="1" stop-color="#285c7b"/></linearGradient>
  <linearGradient id="amber" x1="0" x2="1"><stop stop-color="#bd5926"/><stop offset="1" stop-color="#e98d43"/></linearGradient>
  <linearGradient id="green" x1="0" x2="1"><stop stop-color="#267158"/><stop offset="1" stop-color="#49a17a"/></linearGradient>
  <linearGradient id="device" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e8e4e0"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#463b35" flood-opacity=".14"/></filter>
  <marker id="arrowN" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#285c7b"/></marker>
  <marker id="arrowG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#378568"/></marker>
  <marker id="arrowO" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#db7937"/></marker>
  <style>
    text{font-family:Arial,'DejaVu Sans',sans-serif;fill:#25333e}.title{font-size:38px;font-weight:700;fill:#182b3a}.subtitle{font-size:17px;fill:#63727b}.step{font-size:21px;font-weight:700;fill:#fff}.label{font-size:16px;font-weight:700}.small{font-size:13px;fill:#4e5e66}.tiny{font-size:12px;fill:#5a666c}.panel{fill:#fffdfa;stroke:#e5ddd3;stroke-width:1.5}.part{fill:#f4f7f8;stroke:#7592a2;stroke-width:2}.num{font-size:17px;font-weight:700;fill:#fff}
  </style>
</defs>
<rect width="1600" height="1000" fill="url(#bg)"/>
<text x="800" y="55" text-anchor="middle" class="title">Ri7aLive — transmettre une expérience olfactive</text>
<text x="800" y="86" text-anchor="middle" class="subtitle">Mesurer une empreinte de l’air, envoyer des données, puis proposer une restitution approximative</text>

<!-- Main panels -->
<g filter="url(#shadow)"><rect x="38" y="125" width="470" height="690" rx="20" class="panel"/><rect x="565" y="125" width="470" height="690" rx="20" class="panel"/><rect x="1092" y="125" width="470" height="690" rx="20" class="panel"/></g>
<path d="M38 145q0-20 20-20h430q20 0 20 20v54H38z" fill="url(#navy)"/><path d="M565 145q0-20 20-20h430q20 0 20 20v54H565z" fill="url(#amber)"/><path d="M1092 145q0-20 20-20h430q20 0 20 20v54h-470z" fill="url(#green)"/>
<circle cx="70" cy="162" r="19" fill="#ffffff" fill-opacity=".2"/><text x="70" y="168" text-anchor="middle" class="num">1</text><text x="101" y="169" class="step">MESURER — au restaurant</text>
<circle cx="597" cy="162" r="19" fill="#ffffff" fill-opacity=".2"/><text x="597" y="168" text-anchor="middle" class="num">2</text><text x="628" y="169" class="step">TRAITER — créer un profil</text>
<circle cx="1124" cy="162" r="19" fill="#ffffff" fill-opacity=".2"/><text x="1124" y="168" text-anchor="middle" class="num">3</text><text x="1155" y="169" class="step">RESTITUER — chez l’utilisateur</text>

<!-- Step 1 scene -->
<rect x="65" y="225" width="416" height="205" rx="14" fill="#f7eee3" stroke="#e6d4c3"/>
<path d="M87 374h368" stroke="#c5b19e" stroke-width="5"/><rect x="95" y="333" width="240" height="41" rx="5" fill="#d9c6b2"/><rect x="120" y="279" width="157" height="54" rx="6" fill="#555b5d"/><rect x="133" y="290" width="62" height="43" fill="#353c40"/><path d="M205 333v-37q0-10 12-10h50v47" fill="#656d70"/><path d="M300 344q5-47 50-47t49 47z" fill="#a9502a" stroke="#74402c" stroke-width="3"/><path d="M297 344h105" stroke="#74402c" stroke-width="5"/><path d="M316 293q-9-24 5-35m22 34q-3-31 13-42m14 43q12-22 8-35" fill="none" stroke="#d5a77e" stroke-width="4" stroke-linecap="round" opacity=".8"/>
<text x="275" y="252" text-anchor="middle" class="label">Source: plat préparé / cuisine</text>
<text x="275" y="404" text-anchor="middle" class="small">Prélèvement d’air près du plat — pas une capture de la recette</text>
<!-- sampling module -->
<rect x="76" y="465" width="390" height="292" rx="16" fill="#f9fbfc" stroke="#aabdc7" stroke-width="2"/>
<text x="271" y="493" text-anchor="middle" class="label">Module de mesure (prototype)</text>
<!-- airflow and filter -->
<path d="M98 548h54" stroke="#db7937" stroke-width="4" marker-end="url(#arrowO)"/><text x="123" y="535" text-anchor="middle" class="tiny">Air ambiant</text>
<rect x="160" y="522" width="64" height="52" rx="8" class="part"/><path d="M171 532v32m10-32v32m10-32v32m10-32v32" stroke="#b6c8cf" stroke-width="3"/><text x="192" y="594" text-anchor="middle" class="tiny">Filtre poussière</text>
<path d="M226 548h32" stroke="#db7937" stroke-width="4" marker-end="url(#arrowO)"/>
<rect x="264" y="515" width="94" height="70" rx="12" fill="#e9f2f5" stroke="#557d91" stroke-width="2"/><circle cx="285" cy="538" r="8" fill="#4b93a8"/><circle cx="307" cy="538" r="8" fill="#d28a43"/><circle cx="329" cy="538" r="8" fill="#8b6aa5"/><circle cx="285" cy="560" r="8" fill="#77a36c"/><circle cx="307" cy="560" r="8" fill="#c56565"/><circle cx="329" cy="560" r="8" fill="#637f98"/><text x="311" y="606" text-anchor="middle" class="tiny">Matrice de capteurs VOC</text>
<path d="M359 548h28" stroke="#db7937" stroke-width="4" marker-end="url(#arrowO)"/><circle cx="414" cy="548" r="23" fill="#dbe9ed" stroke="#557d91" stroke-width="2"/><path d="M405 539l18 9-18 9z" fill="#557d91"/><text x="414" y="590" text-anchor="middle" class="tiny">Micro-pompe</text>
<rect x="107" y="645" width="149" height="72" rx="10" fill="#e8edf4" stroke="#7289a0" stroke-width="2"/><rect x="124" y="660" width="28" height="24" rx="3" fill="#647f98"/><path d="M158 665h80m-80 12h60m-60 12h70" stroke="#8a9cac" stroke-width="3"/><text x="181" y="737" text-anchor="middle" class="tiny">Carte de contrôle</text>
<rect x="283" y="645" width="153" height="72" rx="10" fill="#fff3e7" stroke="#dcaa72" stroke-width="2"/><text x="359" y="672" text-anchor="middle" class="small">Température +</text><text x="359" y="694" text-anchor="middle" class="small">humidité mesurées</text><text x="359" y="737" text-anchor="middle" class="tiny">Compensation des mesures</text>

<!-- Connector 1 to 2 -->
<path d="M474 458h99" stroke="#285c7b" stroke-width="5" marker-end="url(#arrowN)"/><text x="523" y="438" text-anchor="middle" class="small">Données</text>

<!-- Step 2 -->
<text x="800" y="232" text-anchor="middle" class="label">Traitement logiciel</text>
<rect x="650" y="264" width="300" height="99" rx="18" fill="#e9f4f8" stroke="#6e9eb1" stroke-width="2"/><path d="M692 326v-27l28-20 28 20v27z" fill="#72afc4" stroke="#4f8196" stroke-width="2"/><path d="M720 279v47m-23-23h47" stroke="#fff" stroke-width="3"/><text x="817" y="301" text-anchor="middle" class="label">Profil d’empreinte</text><text x="817" y="328" text-anchor="middle" class="small">lectures capteurs + contexte</text>
<path d="M800 366v40" stroke="#db7937" stroke-width="4" marker-end="url(#arrowO)"/>
<rect x="635" y="416" width="330" height="132" rx="16" fill="#fff8ef" stroke="#d9a06c" stroke-width="2"/><text x="800" y="445" text-anchor="middle" class="label">Comparaison à une bibliothèque</text><rect x="671" y="466" width="71" height="49" rx="7" fill="#f3e5d7" stroke="#c79469"/><path d="M684 500l11-17 10 11 12-15 13 21z" fill="#bf7a4d"/><text x="706" y="535" text-anchor="middle" class="tiny">Profils testés</text><path d="M753 490h59" stroke="#378568" stroke-width="4" marker-end="url(#arrowG)"/><rect x="824" y="466" width="102" height="49" rx="7" fill="#eaf3ea" stroke="#81a984"/><path d="M838 503v-14h14v14m7 0v-24h14v24m7 0v-18h14v18" fill="#73a476"/><text x="875" y="535" text-anchor="middle" class="tiny">Recette approchée</text>
<path d="M800 551v37" stroke="#db7937" stroke-width="4" marker-end="url(#arrowO)"/>
<rect x="645" y="596" width="310" height="95" rx="15" fill="#f3eff8" stroke="#9c8aaf" stroke-width="2"/><rect x="676" y="619" width="50" height="45" rx="7" fill="#82729a"/><path d="M686 630h30m-30 9h30m-30 9h23" stroke="#fff" stroke-width="3"/><text x="830" y="631" text-anchor="middle" class="label">Commande transmise</text><text x="830" y="657" text-anchor="middle" class="small">vers l’appareil connecté</text><text x="800" y="727" text-anchor="middle" class="small">Le téléphone choisit / pilote ; il ne produit pas la senteur.</text>
<rect x="622" y="751" width="356" height="42" rx="10" fill="#fff0e3"/><text x="800" y="778" text-anchor="middle" class="small">Résultat dépendant des capteurs et des cartouches disponibles</text>

<!-- Connector 2 to 3 -->
<path d="M1002 458h99" stroke="#378568" stroke-width="5" marker-end="url(#arrowG)"/><text x="1051" y="438" text-anchor="middle" class="small">Commande</text>

<!-- Step 3 device cutaway -->
<text x="1327" y="229" text-anchor="middle" class="label">Diffuseur personnel — vue en coupe</text>
<rect x="1173" y="252" width="310" height="479" rx="36" fill="url(#device)" stroke="#a9a2a0" stroke-width="3" filter="url(#shadow)"/>
<rect x="1194" y="275" width="268" height="51" rx="17" fill="#f6f0ee" stroke="#d5cac5"/><circle cx="1217" cy="300" r="7" fill="#a14550"/><text x="1326" y="306" text-anchor="middle" class="small">Diffuseur Ri7aLive</text>
<!-- Cartridges -->
<text x="1327" y="357" text-anchor="middle" class="label">Cartouches remplaçables</text>
<g>
 <rect x="1206" y="372" width="52" height="97" rx="13" fill="#f7e9e1" stroke="#bf8b77" stroke-width="2"/><rect x="1217" y="386" width="30" height="51" rx="8" fill="#cb8763"/><path d="M1223 445h18" stroke="#8b5947" stroke-width="4"/><text x="1232" y="489" text-anchor="middle" class="tiny">A</text>
 <rect x="1269" y="372" width="52" height="97" rx="13" fill="#f3eee1" stroke="#b89c69" stroke-width="2"/><rect x="1280" y="386" width="30" height="51" rx="8" fill="#d1b66d"/><path d="M1286 445h18" stroke="#947f49" stroke-width="4"/><text x="1295" y="489" text-anchor="middle" class="tiny">B</text>
 <rect x="1332" y="372" width="52" height="97" rx="13" fill="#e8edf2" stroke="#8094a6" stroke-width="2"/><rect x="1343" y="386" width="30" height="51" rx="8" fill="#8aa9bf"/><path d="M1349 445h18" stroke="#617e91" stroke-width="4"/><text x="1358" y="489" text-anchor="middle" class="tiny">C</text>
 <rect x="1395" y="372" width="52" height="97" rx="13" fill="#f2e7ee" stroke="#a4809a" stroke-width="2"/><rect x="1406" y="386" width="30" height="51" rx="8" fill="#b58da9"/><path d="M1412 445h18" stroke="#886a80" stroke-width="4"/><text x="1421" y="489" text-anchor="middle" class="tiny">D</text>
</g>
<text x="1327" y="515" text-anchor="middle" class="tiny">Matières odorantes adaptées et validées</text>
<!-- valves/pumps -->
<path d="M1232 470v27m63-27v27m63-27v27m63-27v27" stroke="#a66b58" stroke-width="3" stroke-dasharray="5 4"/>
<rect x="1210" y="500" width="237" height="59" rx="12" fill="#f8f1ea" stroke="#cbad91" stroke-width="2"/>
<circle cx="1240" cy="529" r="15" fill="#dbd6d1" stroke="#86796f" stroke-width="2"/><path d="M1232 529h16m-8-8v16" stroke="#86796f" stroke-width="2"/><circle cx="1290" cy="529" r="15" fill="#dbd6d1" stroke="#86796f" stroke-width="2"/><path d="M1282 529h16m-8-8v16" stroke="#86796f" stroke-width="2"/><text x="1370" y="525" text-anchor="middle" class="small">Micro-pompes +</text><text x="1370" y="544" text-anchor="middle" class="small">micro-vannes doseuses</text>
<path d="M1328 560v20" stroke="#bd7a4e" stroke-width="4" marker-end="url(#arrowO)"/>
<rect x="1225" y="585" width="206" height="54" rx="22" fill="#fae9df" stroke="#cc9476" stroke-width="2"/><path d="M1248 612h160" stroke="#d98c60" stroke-width="4" marker-end="url(#arrowO)"/><text x="1328" y="659" text-anchor="middle" class="tiny">Chambre de mélange avec air</text>
<path d="M1328 640v28" stroke="#6e8fa0" stroke-width="4" marker-end="url(#arrowN)"/>
<circle cx="1328" cy="685" r="17" fill="#dce7eb" stroke="#698899" stroke-width="2"/><path d="M1328 671q13 14 0 28m-14-14q14-13 28 0" fill="none" stroke="#698899" stroke-width="2"/><path d="M1347 685h78" stroke="#378568" stroke-width="4" marker-end="url(#arrowG)"/>
<text x="1421" y="709" text-anchor="middle" class="tiny">Sortie d’air</text>
<path d="M1187 529h-21v128h48" fill="none" stroke="#8092a0" stroke-width="3"/><rect x="1198" y="672" width="76" height="35" rx="8" fill="#e7edf1" stroke="#9aabb7"/><text x="1236" y="695" text-anchor="middle" class="tiny">Carte + USB</text>

<!-- bottom disclaimer -->
<rect x="39" y="846" width="1522" height="102" rx="18" fill="#fffaf3" stroke="#e4c9a8" stroke-width="2"/>
<circle cx="84" cy="897" r="23" fill="#cf783b"/><text x="84" y="905" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">!</text>
<text x="125" y="883" class="label">À préciser dans le projet</text>
<text x="125" y="912" class="small">Le système ne transporte pas la molécule originale et ne garantit pas une reproduction exacte : il propose une senteur approchée à partir des cartouches installées.</text>
<text x="125" y="934" class="small">Sécurité : matières conçues/évaluées pour diffusion dans l’air, dosage limité, ventilation et arrêt automatique en cas d’anomalie.</text>
<text x="800" y="982" text-anchor="middle" class="tiny">Schéma conceptuel — prototype à valider par des essais de mesure, de formulation et de sécurité.</text>
</svg>
