<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">Sphère 3D abstraite en or et bordeaux</title>
  <desc id="desc">Une sphère abstraite et lumineuse avec des anneaux orbitaux animés, sans personnage.</desc>
  <defs>
    <radialGradient id="core" cx="34%" cy="28%" r="72%">
      <stop offset="0" stop-color="#fff1d2"/>
      <stop offset=".18" stop-color="#d9ad62"/>
      <stop offset=".48" stop-color="#8b1e3f"/>
      <stop offset=".82" stop-color="#29131d"/>
      <stop offset="1" stop-color="#0d0b0e"/>
    </radialGradient>
    <linearGradient id="orbit" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff1d2" stop-opacity=".2"/>
      <stop offset=".45" stop-color="#f5d7a8"/>
      <stop offset="1" stop-color="#8b1e3f" stop-opacity=".4"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="120" cy="120" r="102" fill="#0d0b0e"/>
  <circle cx="120" cy="120" r="65" fill="url(#core)" filter="url(#glow)">
    <animate attributeName="r" values="63;67;63" dur="4s" repeatCount="indefinite"/>
  </circle>
  <ellipse cx="120" cy="120" rx="99" ry="34" fill="none" stroke="url(#orbit)" stroke-width="2.5" transform="rotate(-28 120 120)">
    <animateTransform attributeName="transform" type="rotate" from="0 120 120" to="360 120 120" dur="12s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="120" cy="120" rx="91" ry="29" fill="none" stroke="#f5d7a8" stroke-opacity=".65" stroke-width="1.3" transform="rotate(48 120 120)">
    <animateTransform attributeName="transform" type="rotate" from="360 120 120" to="0 120 120" dur="16s" repeatCount="indefinite"/>
  </ellipse>
  <circle cx="28" cy="76" r="4" fill="#fff1d2" filter="url(#glow)">
    <animate attributeName="opacity" values=".25;1;.25" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="195" cy="171" r="3" fill="#d9ad62" filter="url(#glow)">
    <animate attributeName="opacity" values="1;.3;1" dur="3.4s" repeatCount="indefinite"/>
  </circle>
  <path d="M80 91c15-18 37-26 57-21" fill="none" stroke="#fff7e7" stroke-opacity=".6" stroke-width="3" stroke-linecap="round"/>
</svg>
