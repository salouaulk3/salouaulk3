<svg xmlns="http://www.w3.org/2000/svg" width="210" height="210" viewBox="0 0 210 210" role="img" aria-labelledby="title desc">
  <title id="title">Luxury ninja mascot</title>
  <desc id="desc">A stylized futuristic ninja in black and gold tones with soft motion.</desc>
  <defs>
    <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f9dba8"/>
      <stop offset="0.5" stop-color="#d9ad62"/>
      <stop offset="1" stop-color="#8d6a39"/>
    </linearGradient>
    <linearGradient id="black" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#201c20"/>
      <stop offset="1" stop-color="#0d0d0f"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="210" height="210" rx="34" fill="#0d0d0f"/>
  <g filter="url(#softGlow)">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="2.8s" repeatCount="indefinite"/>

    <path d="M42 124c7-47 38-70 78-72 39 2 72 25 78 72l-14 33c-10 12-31 21-64 21s-54-9-64-21z" fill="url(#black)" stroke="#d9ad62" stroke-width="2"/>
    <path d="M70 116l18 12 24-19 18 19 18-12 10 25c-25 17-59 20-84 0z" fill="#f3e6d2" opacity="0.9"/>

    <path d="M86 125c12-8 26-13 40-13 18 0 32 5 42 14l-4 14c-10 9-26 14-38 14-15 0-30-5-40-15z" fill="#17171b"/>
    <circle cx="94" cy="123" r="7" fill="#0d0d0f"/>
    <circle cx="131" cy="123" r="7" fill="#0d0d0f"/>
    <path d="M92 98c10-11 16-17 25-17 9 0 18 6 25 17" fill="none" stroke="url(#gold)" stroke-width="4" stroke-linecap="round"/>
    <path d="M56 129l-18 42c-5 12 9 22 19 15l17-13 -18-44z" fill="url(#gold)" opacity="0.9"/>
    <path d="M154 129l18 42c5 12-9 22-19 15l-17-13 18-44z" fill="url(#gold)" opacity="0.9"/>

    <path d="M79 160l-12 28c-5 10 5 20 17 16l22-12-27-32z" fill="#1d1b22"/>
    <path d="M130 160l12 28c5 10-5 20-17 16l-22-12 27-32z" fill="#1d1b22"/>

    <path d="M84 178h38l-8 18H92z" fill="url(#gold)"/>
    <path d="M74 139h58l6 10H68z" fill="#e7d4a5" opacity="0.75"/>
  </g>
</svg>
