<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">Orbe 3D abstrait en or et bordeaux</title>
  <desc id="desc">Une sphère lumineuse aux anneaux orbitaux animés, sans fond ni personnage.</desc>
  <defs>
    <radialGradient id="core" cx="33%" cy="26%" r="76%">
      <stop offset="0" stop-color="#fff5de"/>
      <stop offset=".15" stop-color="#f5d7a8"/>
      <stop offset=".3" stop-color="#bd6b79"/>
      <stop offset=".58" stop-color="#8b1e3f"/>
      <stop offset=".86" stop-color="#29131d"/>
      <stop offset="1" stop-color="#100c10"/>
    </radialGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1d2" stop-opacity=".08"/>
      <stop offset=".48" stop-color="#f5d7a8"/>
      <stop offset="1" stop-color="#8b1e3f" stop-opacity=".3"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 2;0 -3;0 2" dur="5s" repeatCount="indefinite"/>
    <circle cx="120" cy="120" r="65" fill="url(#core)" filter="url(#glow)">
      <animate attributeName="r" values="62;66;62" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <ellipse cx="120" cy="120" rx="99" ry="34" fill="none" stroke="url(#orbit)" stroke-width="2.5">
      <animateTransform attributeName="transform" type="rotate" from="-28 120 120" to="332 120 120" dur="14s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="120" cy="120" rx="89" ry="29" fill="none" stroke="#f5d7a8" stroke-opacity=".65" stroke-width="1.3">
      <animateTransform attributeName="transform" type="rotate" from="48 120 120" to="-312 120 120" dur="19s" repeatCount="indefinite"/>
    </ellipse>
    <path d="M80 91c15-18 37-26 57-21" fill="none" stroke="#fff7e7" stroke-opacity=".78" stroke-width="3" stroke-linecap="round"/>
    <circle cx="23" cy="80" r="3.5" fill="#fff1d2" filter="url(#glow)">
      <animate attributeName="opacity" values=".2;1;.2" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="213" cy="158" r="3" fill="#d9ad62" filter="url(#glow)">
      <animate attributeName="opacity" values="1;.25;1" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
